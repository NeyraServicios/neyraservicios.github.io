<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Impresora Epson EcoTank</title>
  <desc id="desc">Ilustración vectorial de una impresora multifunción de tinta continua.</desc>
  <defs>
